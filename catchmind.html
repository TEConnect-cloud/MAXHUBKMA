<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표현력 검사 · 테크커넥트 게임 이벤트</title>
<link rel="stylesheet" href="style.css">
<style>
  #drawCanvas{
    width:100%;
    max-width: 560px;
    aspect-ratio: 4/3;
    background: #F3F1EC;
    border-radius: 12px;
    display:block;
    margin: 0 auto;
    touch-action: none;
    cursor: crosshair;
  }
  .tools{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-top:16px;
  }
  #canvasWrap{ position:relative; max-width:560px; margin:0 auto; }
  #wordCorner{
    position:absolute;
    left:10px; bottom:10px;
    color:#0F1226;
    font-weight:800;
    font-size:1.05rem;
    background:rgba(255,255,255,0.85);
    padding:4px 10px;
    border-radius:8px;
    pointer-events:none;
  }
  .swatch{
    width:28px; height:28px; border-radius:50%;
    border: 2px solid var(--line);
    cursor:pointer;
  }
  .swatch.active{ border-color: var(--cyan); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><img src="logo.png" alt="TEConnect" style="height:24px; width:auto;"></div>
  <a class="back" href="index.html">← 게임 목록</a>
</header>

<main class="game-shell">
  <div class="game-head">
    <h1>🎨 표현력 검사</h1>
    <p>한 사람이 제시어를 보고 그림을 그리면, 다른 사람이 맞혀보세요.</p>
  </div>

  <div class="game-board">
    <div class="hud">
      <div class="stat">남은 시간 <b id="timer">60</b>초</div>
    </div>

    <div style="text-align:center; margin-bottom:14px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn btn-ghost" onclick="newRound()">새 제시어 뽑기</button>
      <button class="btn btn-ghost" id="revealBtn" onclick="toggleReveal()">제시어 보기</button>
      <button class="btn btn-ghost" id="correctBtn" onclick="markCorrect()">✅ 정답</button>
      <button class="btn btn-ghost" onclick="Ranking.showModal('catchmind','표현력 검사')">랭킹 보기</button>
    </div>

    <div id="canvasWrap">
      <canvas id="drawCanvas" width="560" height="420"></canvas>
      <div id="wordCorner">? ? ?</div>
    </div>

    <div class="tools">
      <span class="swatch active" style="background:#0F1226" data-color="#0F1226" onclick="setColor(this)"></span>
      <span class="swatch" style="background:#FF6B5B" data-color="#FF6B5B" onclick="setColor(this)"></span>
      <span class="swatch" style="background:#FFB648" data-color="#FFB648" onclick="setColor(this)"></span>
      <span class="swatch" style="background:#57E0D8" data-color="#57E0D8" onclick="setColor(this)"></span>
      <span class="swatch" style="background:#3A6DF0" data-color="#3A6DF0" onclick="setColor(this)"></span>
      <input type="range" min="2" max="20" value="5" id="brushSize" oninput="setSize(this.value)">
      <button class="btn btn-ghost" onclick="clearCanvas()">전체 지우기</button>
    </div>

    <div id="toast" class="toast info">
      ⏰ 시간 종료! 정답을 공개해보세요.
      <div style="margin-top:12px;">
        <button class="btn btn-primary" onclick="newRound()">다음 라운드</button>
      </div>
    </div>
  </div>
</main>

<div id="resultModal" class="modal-overlay hidden">
  <div class="modal-card">
    <h2>🎉 성공! 🎉</h2>
    <p id="resultTimeText" style="margin:14px 0; font-size:1.1rem; font-weight:700; color:var(--cyan);"></p>
    <button class="btn btn-primary" onclick="openRankingEntry()">랭킹 등록</button>
    <div style="margin-top:10px;">
      <button class="btn btn-ghost" onclick="closeResultModal()">닫기</button>
    </div>
  </div>
</div>

<footer class="site-footer">COPYRIGHT (c) TEConnect Inc. ALL RIGHTS RESERVED.</footer>

<script src="ranking.js"></script>
<script>
const WORDS = ['코끼리','피자','전자칠판','우산','축구공','로봇','무지개','자전거','고양이','비행기','선풍기','아이스크림','기린','카메라','스마트폰','수박','토끼','드론','버섯','안경'];

const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let drawing = false, color = '#0F1226', size = 5, currentWord = '', seconds = 60, timerId, revealed = false, roundLocked = false;

function resizeCanvasBuffer(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
}
window.addEventListener('resize', ()=>{ clearCanvas(); });

function pos(e){
  const rect = canvas.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  return { x: p.clientX - rect.left, y: p.clientY - rect.top };
}

function start(e){ drawing = true; draw(e); }
function end(){ drawing = false; ctx.beginPath(); }
function draw(e){
  if(!drawing) return;
  e.preventDefault();
  const {x,y} = pos(e);
  ctx.lineWidth = size;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.lineTo(x,y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x,y);
}

canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', end);
canvas.addEventListener('mouseleave', end);
canvas.addEventListener('touchstart', start);
canvas.addEventListener('touchmove', draw);
canvas.addEventListener('touchend', end);

function setColor(el){
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  color = el.dataset.color;
}
function setSize(v){ size = Number(v); }
function clearCanvas(){
  resizeCanvasBuffer();
  ctx.fillStyle = '#F3F1EC';
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

function pickWord(){
  return WORDS[Math.floor(Math.random()*WORDS.length)];
}

function toggleReveal(){
  revealed = !revealed;
  document.getElementById('wordCorner').textContent = revealed ? currentWord : '? ? ?';
  document.getElementById('revealBtn').textContent = revealed ? '제시어 숨기기' : '제시어 보기';

  if(revealed){
    // 제시어를 보여주는 동안은 타이머 정지
    clearInterval(timerId);
  } else {
    // 제시어를 숨기는 순간부터 60초 새로 카운트다운 시작
    seconds = 60;
    document.getElementById('timer').textContent = seconds;
    roundLocked = false;
    document.getElementById('toast').classList.remove('show');
    clearInterval(timerId);
    timerId = setInterval(tick, 1000);
  }
}

let lastElapsed = 0;

function markCorrect(){
  if(roundLocked || !currentWord) return;
  roundLocked = true;
  clearInterval(timerId);
  lastElapsed = Math.max(0, 60 - seconds);
  document.getElementById('resultTimeText').textContent = `걸린 시간: ${lastElapsed}초`;
  document.getElementById('resultModal').classList.remove('hidden');
}

function openRankingEntry(){
  document.getElementById('resultModal').classList.add('hidden');
  Ranking.promptNameAndSave('catchmind', '표현력 검사', lastElapsed, `${lastElapsed}초`, 'asc');
}

function closeResultModal(){
  document.getElementById('resultModal').classList.add('hidden');
}

function tick(){
  seconds--;
  document.getElementById('timer').textContent = seconds;
  if(seconds<=0){
    clearInterval(timerId);
    roundLocked = true;
    document.getElementById('toast').classList.add('show');
  }
}

function newRound(){
  currentWord = pickWord();
  revealed = false;
  roundLocked = false;
  document.getElementById('wordCorner').textContent = '? ? ?';
  document.getElementById('revealBtn').textContent = '제시어 보기';
  seconds = 60;
  document.getElementById('timer').textContent = seconds;
  document.getElementById('toast').classList.remove('show');
  clearCanvas();
  clearInterval(timerId);
  // 타이머는 여기서 시작하지 않음 — "제시어 숨기기"를 누르는 순간부터 시작됩니다.
}

newRound();
</script>

</body>
</html>
