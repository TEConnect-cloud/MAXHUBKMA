<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공간지각력 검사 · 테크커넥트 게임 이벤트</title>
<link rel="stylesheet" href="style.css">
<style>
  :root {
      --wall-color: #2c3e50;
      --path-color: #ecf0f1;
      --primary-blue: #66a6ff;
  }

  html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f0f4f8;
  }

  .game-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background-color: white;
      padding: clamp(15px, 2vh, 30px);
      box-sizing: border-box;
      overflow-y: auto;
  }

  .header-panel {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
  }

  .header-panel h1 { color: var(--wall-color); font-size: clamp(1.5em, 5vw, 2.2em); margin: 0; }
  .timer-display { font-size: 1.2em; font-weight: bold; color: var(--wall-color); }

  #fullscreen-target {
      flex-grow: 1;
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
  }

  .canvas-container {
      position: relative;
      width: 95vmin;
      height: 95vmin;
      max-width: 100%;
      max-height: 100%;
  }

  #mazeCanvas {
      width: 100%;
      height: 100%;
      background-color: var(--path-color);
      border-radius: 10px;
      cursor: grab;
  }
  #mazeCanvas.grabbing { cursor: grabbing; }

  .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.7); border-radius: 10px;
      display: flex; justify-content: center; align-items: center;
      color: white; font-size: 2.5em; font-weight: bold; z-index: 10;
      opacity: 1; transition: opacity 0.3s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-btn { padding: 20px 40px; font-size: 1.2em; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; background-color: #fff; color: var(--wall-color); transition: transform 0.2s; }
  .overlay-btn:hover { transform: scale(1.05); }
  .end-content { text-align: center; }
  #endMessage { margin-bottom: 10px; }
  #endTime { font-size: 0.8em; margin-bottom: 20px; }

  .controls {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
  }
  .controls button, .home-btn {
      padding: 12px 25px; font-size: 1em; font-weight: bold;
      border: 2px solid #ddd; background-color: #f8f8f8; border-radius: 10px;
      cursor: pointer; text-decoration: none; color: #333; transition: all 0.2s ease;
  }
  .controls button:hover, .home-btn:hover { border-color: var(--primary-blue); color: var(--primary-blue); }
  .home-btn { background-color: #6c757d; border-color: #6c757d; color: white; }

  #fullscreen-target:fullscreen { background-color: #f0f4f8; padding: 20px; display: flex; justify-content: center; align-items: center; }
  #fullscreen-target:fullscreen .canvas-container {
      width: 90vh;
      height: 90vh;
      max-width: 90vw;
      max-height: 90vw;
  }

  .exit-fullscreen-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      font-size: 24px;
      font-weight: bold;
      line-height: 46px;
      text-align: center;
      cursor: pointer;
      z-index: 2147473647;
      display: none;
  }
</style>
</head>
<body>

<div class="game-wrapper" id="gameWrapper">
  <div class="header-panel">
    <h1>공간지각력 검사</h1>
    <div class="timer-display">⏱ 남은 시간 <span id="timer">300</span>초</div>
  </div>

  <div id="fullscreen-target">
    <div class="canvas-container">
      <canvas id="mazeCanvas"></canvas>

      <div id="startOverlay" class="overlay">
        <button id="startButton" class="overlay-btn">시작하기</button>
      </div>

      <div id="pauseOverlay" class="overlay hidden">
        <div>⏸ 일시정지 중</div>
      </div>

      <div id="endOverlay" class="overlay hidden">
        <div class="end-content">
          <div id="endMessage"></div>
          <div id="endTime"></div>
          <button id="modalRestartButton" class="overlay-btn">다시 시작</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="showRankingBtn">랭킹 보기</button>
    <button id="pauseBtn">일시정지</button>
    <button id="retryBtn">다시하기</button>
    <button id="fullscreenBtn">전체화면</button>
    <a href="index.html" class="home-btn">메인으로</a>
  </div>
</div>

<div id="exitFullscreenBtn" class="exit-fullscreen-btn">✕</div>

<script src="ranking.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const wrapper = document.getElementById('gameWrapper');
    const fullscreenTarget = document.getElementById('fullscreen-target');
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('startOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const endOverlay = document.getElementById('endOverlay');
    const startBtn = document.getElementById('startButton');
    const modalRestartButton = document.getElementById('modalRestartButton');
    const retryBtn = document.getElementById('retryBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const timerEl = document.getElementById('timer');
    const endMessageEl = document.getElementById('endMessage');
    const endTimeEl = document.getElementById('endTime');
    const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
    const showRankingBtn = document.getElementById('showRankingBtn');

    const GAME_ID = 'maze';
    const GAME_TITLE = '공간지각력 검사';

    let cols, rows, cellSize, maze, player, rabbit, stack = [];
    let isGameRunning = false, isPaused = false, isDragging = false;
    let startTime, timerInterval, timeLeft;
    const gameTime = 300; // 5분

    class Cell {
        constructor(c, r) { this.c = c; this.r = r; this.walls = { top: true, right: true, bottom: true, left: true }; this.visited = false; }
        draw() {
            const x = this.c * cellSize; const y = this.r * cellSize;
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--wall-color');
            ctx.lineWidth = 4;
            if (this.walls.top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y); ctx.stroke(); }
            if (this.walls.right) { ctx.beginPath(); ctx.moveTo(x + cellSize, y); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke(); }
            if (this.walls.bottom) { ctx.beginPath(); ctx.moveTo(x + cellSize, y + cellSize); ctx.lineTo(x, y + cellSize); ctx.stroke(); }
            if (this.walls.left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cellSize); ctx.stroke(); }
        }
        getNeighbors() {
            const n = [];
            const t = maze[this.r - 1]?.[this.c], r = maze[this.r]?.[this.c + 1], b = maze[this.r + 1]?.[this.c], l = maze[this.r]?.[this.c - 1];
            if (t && !t.visited) n.push(t);
            if (r && !r.visited) n.push(r);
            if (b && !b.visited) n.push(b);
            if (l && !l.visited) n.push(l);
            return n.length > 0 ? n[Math.floor(Math.random() * n.length)] : undefined;
        }
    }

    function generateMaze() {
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) maze[r][c] = new Cell(c, r);
        let current = maze[0][0]; current.visited = true; stack = [current];
        while (stack.length > 0) {
            let neighbor = current.getNeighbors();
            if (neighbor) { removeWalls(current, neighbor); current = neighbor; current.visited = true; stack.push(current); }
            else { current = stack.pop(); }
        }
    }
    function removeWalls(a, b) {
        const dc = a.c - b.c, dr = a.r - b.r;
        if (dc === 1) { a.walls.left = false; b.walls.right = false; }
        else if (dc === -1) { a.walls.right = false; b.walls.left = false; }
        if (dr === 1) { a.walls.top = false; b.walls.bottom = false; }
        else if (dr === -1) { a.walls.bottom = false; b.walls.top = false; }
    }

    function setup() {
        const canvasSize = canvas.getBoundingClientRect().width;
        cellSize = canvasSize / 20;
        cols = Math.floor(canvasSize / cellSize);
        rows = Math.floor(canvasSize / cellSize);
        canvas.width = cols * cellSize; canvas.height = rows * cellSize;
        maze = Array(rows).fill(null).map(() => Array(cols).fill(null));
        player = { x: cellSize / 2, y: cellSize / 2, radius: cellSize / 2.5 };
        rabbit = { x: (cols - 0.5) * cellSize, y: (rows - 0.5) * cellSize };
        generateMaze();
        draw();
    }

    function redrawOnResize() {
        if (!isGameRunning) return;
        const playerXRatio = player.x / (cols * cellSize);
        const playerYRatio = player.y / (rows * cellSize);
        const canvasSize = canvas.getBoundingClientRect().width;
        cellSize = canvasSize / 20;
        cols = Math.floor(canvasSize / cellSize);
        rows = Math.floor(canvasSize / cellSize);
        canvas.width = cols * cellSize; canvas.height = rows * cellSize;
        player.x = playerXRatio * canvas.width;
        player.y = playerYRatio * canvas.height;
        player.radius = cellSize / 2.5;
        rabbit.x = (cols - 0.5) * cellSize;
        rabbit.y = (rows - 0.5) * cellSize;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!maze) return;
        maze.forEach(row => row.forEach(cell => cell.draw()));
        ctx.font = `${cellSize * 0.8}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🐇', rabbit.x, rabbit.y);
        ctx.fillText('🐢', player.x, player.y);
    }

    function gameLoop() { if (!isGameRunning || isPaused) return; draw(); checkWin(); requestAnimationFrame(gameLoop); }

    function movePlayer(targetX, targetY) {
        const dx = targetX - player.x;
        const dy = targetY - player.y;
        const distance = Math.hypot(dx, dy);
        const steps = Math.max(1, Math.floor(distance / (player.radius / 3)));
        let nextX = player.x;
        let nextY = player.y;
        for (let i = 1; i <= steps; i++) {
            const tempX = player.x + (dx / steps) * i;
            const tempY = player.y + (dy / steps) * i;
            if (isColliding(tempX, tempY)) break;
            nextX = tempX; nextY = tempY;
        }
        player.x = nextX; player.y = nextY;
    }

    function isColliding(x, y) {
        const r = player.radius * 0.8;
        const c = Math.floor(x / cellSize);
        const row = Math.floor(y / cellSize);
        const cell = maze[row]?.[c];
        if (!cell) return true;
        if (x - r < c * cellSize && cell.walls.left) return true;
        if (x + r > (c + 1) * cellSize && cell.walls.right) return true;
        if (y - r < row * cellSize && cell.walls.top) return true;
        if (y + r > (row + 1) * cellSize && cell.walls.bottom) return true;
        return false;
    }

    function checkWin() { const distance = Math.hypot(player.x - rabbit.x, player.y - rabbit.y); if (distance < player.radius) { endGame(true); } }

    function startTimer() {
        clearInterval(timerInterval);
        startTime = Date.now();
        timeLeft = gameTime;
        timerEl.textContent = timeLeft;
        timerInterval = setInterval(() => {
            if (isPaused) return;
            timeLeft--;
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) endGame(false);
        }, 1000);
    }

    function startGame() {
        isGameRunning = true; isPaused = false;
        startOverlay.classList.add('hidden');
        endOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        pauseBtn.textContent = '일시정지';
        setup();
        startTimer();
        requestAnimationFrame(gameLoop);
    }

    function endGame(isSuccess) {
        isGameRunning = false;
        clearInterval(timerInterval);
        endOverlay.classList.remove('hidden');
        if (isSuccess) {
            const timeTaken = Math.floor((Date.now() - startTime) / 1000);
            endMessageEl.textContent = '🎉 성공! 🎉';
            endTimeEl.textContent = `걸린 시간: ${timeTaken}초`;
            Ranking.promptNameAndSave(GAME_ID, GAME_TITLE, timeTaken, `${timeTaken}초`, 'asc');
        } else {
            endMessageEl.textContent = '😭 시간 초과! 😭';
            endTimeEl.textContent = '다시 도전해보세요!';
        }
    }

    function togglePause() { if (!isGameRunning) return; isPaused = !isPaused; pauseOverlay.classList.toggle('hidden', !isPaused); pauseBtn.textContent = isPaused ? '계속하기' : '일시정지'; }
    function toggleFullscreen() { if (!document.fullscreenElement) { fullscreenTarget.requestFullscreen().catch(err => alert(`전체화면 모드를 사용할 수 없습니다: ${err.message}`)); } else { document.exitFullscreen(); } }

    function getPos(e) { const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height; const clientX = e.clientX || e.touches[0].clientX; const clientY = e.clientY || e.touches[0].clientY; return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY }; }
    function onInteractionStart(e) { if (!isGameRunning || isPaused) return; const pos = getPos(e); const distance = Math.hypot(pos.x - player.x, pos.y - player.y); if (distance < player.radius) { isDragging = true; canvas.classList.add('grabbing'); } }
    function onInteractionMove(e) { if (!isDragging || !isGameRunning || isPaused) return; e.preventDefault(); const pos = getPos(e); movePlayer(pos.x, pos.y); }
    function onInteractionEnd() { isDragging = false; canvas.classList.remove('grabbing'); }

    startBtn.addEventListener('click', startGame);
    modalRestartButton.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    showRankingBtn.addEventListener('click', () => { Ranking.showModal(GAME_ID, GAME_TITLE); });

    exitFullscreenBtn.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); });

    canvas.addEventListener('mousedown', onInteractionStart);
    canvas.addEventListener('mousemove', onInteractionMove);
    window.addEventListener('mouseup', onInteractionEnd);
    canvas.addEventListener('touchstart', onInteractionStart, { passive: false });
    canvas.addEventListener('touchmove', onInteractionMove, { passive: false });
    window.addEventListener('touchend', onInteractionEnd);

    function handleResize() { if (isGameRunning) redrawOnResize(); else setup(); }
    window.addEventListener('resize', handleResize);

    document.addEventListener('fullscreenchange', () => {
        exitFullscreenBtn.style.display = document.fullscreenElement ? 'block' : 'none';
        setTimeout(handleResize, 100);
    });

    endOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
    setup();
});
</script>

</body>
</html>
