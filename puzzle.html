<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 퍼즐 · 테크커넥트 게임 이벤트</title>
<link rel="stylesheet" href="style.css">
<style>
  #puzzleGrid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1;
    margin: 0 auto;
    background: var(--ink);
    border-radius: 12px;
    overflow: hidden;
  }
  .tile{
    background-repeat: no-repeat;
    cursor:pointer;
    transition: filter .15s ease;
  }
  .tile:hover{ filter: brightness(1.1); }
  .tile.blank{ background: var(--panel-2); cursor:default; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark">TC</span> 테크커넥트</div>
  <a class="back" href="index.html">← 게임 목록</a>
</header>

<main class="game-shell">
  <div class="game-head">
    <h1>🧩 이미지 퍼즐</h1>
    <p>조각을 클릭해 빈 칸으로 옮기고, 원래 그림을 완성해보세요.</p>
  </div>

  <div class="game-board">
    <div class="hud">
      <div class="stat">이동 횟수 <b id="moves">0</b></div>
      <div class="stat">경과 시간 <b id="timer">0</b>초</div>
    </div>

    <div style="text-align:center; margin-bottom:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <label class="btn btn-primary" style="cursor:pointer;">
        📷 내 사진으로 퍼즐 만들기
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
      </label>
      <button class="btn btn-ghost" onclick="useDefaultImage()">기본 이미지로 되돌리기</button>
    </div>

    <canvas id="srcCanvas" width="420" height="420" style="display:none;"></canvas>
    <div id="puzzleGrid"></div>

    <div id="toast" class="toast win">
      🎉 퍼즐 완성! <span id="resultText"></span>
      <div style="margin-top:12px;">
        <button class="btn btn-primary" onclick="init()">다시하기</button>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">COPYRIGHT (c) TEConnect Inc. ALL RIGHTS RESERVED.</footer>

<script>
const SIZE = 3;
let tiles = [], moves = 0, seconds = 0, timerId, imgURL;
const CUSTOM_IMG_KEY = 'tc_puzzle_custom_image';

function paintSourceImage(){
  const c = document.getElementById('srcCanvas');
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,420,420);
  g.addColorStop(0, '#1D2142');
  g.addColorStop(1, '#0F1226');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,420,420);

  // simple rocket illustration
  ctx.fillStyle = '#57E0D8';
  ctx.beginPath();
  ctx.moveTo(210, 60);
  ctx.quadraticCurveTo(280, 180, 250, 320);
  ctx.lineTo(170, 320);
  ctx.quadraticCurveTo(140, 180, 210, 60);
  ctx.fill();

  ctx.fillStyle = '#FFB648';
  ctx.beginPath();
  ctx.moveTo(170, 260); ctx.lineTo(120, 340); ctx.lineTo(170, 320); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(250, 260); ctx.lineTo(300, 340); ctx.lineTo(250, 320); ctx.fill();

  ctx.fillStyle = '#FF6B5B';
  ctx.beginPath();
  ctx.moveTo(190, 330); ctx.lineTo(210, 380); ctx.lineTo(230, 330); ctx.fill();

  ctx.fillStyle = '#0F1226';
  ctx.beginPath();
  ctx.arc(210, 170, 26, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#F3F1EC';
  ctx.beginPath();
  ctx.arc(210, 170, 16, 0, Math.PI*2);
  ctx.fill();

  // stars
  ctx.fillStyle = '#ECEAF8';
  for(const [x,y] of [[60,60],[350,90],[90,340],[340,300],[50,200],[370,220]]){
    ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fill();
  }

  imgURL = c.toDataURL();
}

function drawCoverFit(img){
  const c = document.getElementById('srcCanvas');
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,420,420);
  const scale = Math.max(420/img.width, 420/img.height);
  const w = img.width*scale, h = img.height*scale;
  const x = (420-w)/2, y = (420-h)/2;
  ctx.drawImage(img, x, y, w, h);
  imgURL = c.toDataURL();
}

function useDefaultImage(){
  try{ localStorage.removeItem(CUSTOM_IMG_KEY); }catch(e){}
  paintSourceImage();
  init(true);
}

document.getElementById('photoInput').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      drawCoverFit(img);
      try{ localStorage.setItem(CUSTOM_IMG_KEY, imgURL); }catch(e){}
      init(true);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function shuffleSolvable(){
  let arr;
  do{
    arr = [...Array(SIZE*SIZE).keys()];
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
  } while(!isSolvable(arr) || isSolved(arr));
  return arr;
}

function isSolvable(arr){
  const flat = arr.filter(v=>v!==8);
  let inv = 0;
  for(let i=0;i<flat.length;i++)
    for(let j=i+1;j<flat.length;j++)
      if(flat[i]>flat[j]) inv++;
  return inv % 2 === 0;
}

function isSolved(arr){
  return arr.every((v,i)=>v===i);
}

function render(){
  const grid = document.getElementById('puzzleGrid');
  grid.innerHTML = '';
  const tileSize = 420/SIZE;
  tiles.forEach((val, idx)=>{
    const div = document.createElement('div');
    if(val === 8){
      div.className = 'tile blank';
    } else {
      div.className = 'tile';
      const sx = (val % SIZE) * tileSize;
      const sy = Math.floor(val / SIZE) * tileSize;
      div.style.backgroundImage = `url(${imgURL})`;
      div.style.backgroundSize = `${420}px ${420}px`;
      div.style.backgroundPosition = `-${sx}px -${sy}px`;
    }
    div.addEventListener('click', ()=>tryMove(idx));
    grid.appendChild(div);
  });
}

function tryMove(idx){
  const blankIdx = tiles.indexOf(8);
  const r1 = Math.floor(idx/SIZE), c1 = idx%SIZE;
  const r2 = Math.floor(blankIdx/SIZE), c2 = blankIdx%SIZE;
  const adjacent = (Math.abs(r1-r2)+Math.abs(c1-c2)) === 1;
  if(!adjacent) return;
  [tiles[idx], tiles[blankIdx]] = [tiles[blankIdx], tiles[idx]];
  moves++;
  document.getElementById('moves').textContent = moves;
  render();
  if(isSolved(tiles)) finish();
}

function finish(){
  clearInterval(timerId);
  document.getElementById('resultText').textContent = `${moves}번 이동, ${seconds}초 만에 완성했습니다.`;
  document.getElementById('toast').classList.add('show');
}

function init(skipPaint){
  if(!skipPaint){
    let custom = null;
    try{ custom = localStorage.getItem(CUSTOM_IMG_KEY); }catch(e){}
    if(custom){ imgURL = custom; }
    else{ paintSourceImage(); }
  }
  tiles = shuffleSolvable();
  moves = 0; seconds = 0;
  document.getElementById('moves').textContent = 0;
  document.getElementById('timer').textContent = 0;
  document.getElementById('toast').classList.remove('show');
  clearInterval(timerId);
  timerId = setInterval(()=>{ seconds++; document.getElementById('timer').textContent = seconds; }, 1000);
  render();
}

init();
</script>

</body>
</html>
