<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>틀린 그림 찾기 · 테크커넥트 게임 이벤트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

:root {
    --bg-color: #1a1a2e;
    --surface-color: #16213e;
    --primary-color: #e94560;
    --text-color: #f0f0f0;
    --shadow-color: rgba(0, 0, 0, 0.5);
    --slot-bg: rgba(255, 255, 255, 0.1);
}
*{ box-sizing: border-box; }
body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    padding: clamp(10px, 2vh, 20px);
}

#container {
    background: var(--surface-color);
    padding: clamp(15px, 2.5vh, 25px);
    border-radius: 20px;
    box-shadow: 0 10px 40px var(--shadow-color);
    width: 100%;
    max-width: 1200px;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.5vh, 15px);
    overflow-y: auto;
}

.header, .info-bar, .controls { flex-shrink: 0; }
h1 { font-size: clamp(1.5em, 3.5vh, 2.2em); margin: 0; text-align: center; }

#game-area {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex-grow: 1;
    min-height: 0;
}

#game-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
    z-index: 10; display: flex; flex-direction: column;
    justify-content: center; align-items: center; border-radius: 10px;
    transition: opacity 0.3s, visibility 0.3s;
}
#game-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#overlayStartBtn { padding: 15px 30px; font-size: clamp(1.2em, 3vh, 1.5em); font-weight: 700; border: none; border-radius: 15px; background-color: var(--primary-color); color: var(--text-color); cursor: pointer; transition: transform 0.2s; }
#overlayStartBtn:hover { transform: scale(1.05); }
#pauseText { font-size: clamp(2em, 5vh, 2.5em); font-weight: 700; color: white; text-shadow: 2px 2px 5px black; }

.image-container { position: relative; border: 2px solid var(--slot-bg); border-radius: 10px; overflow: hidden; display: flex; }
.image-container img { width: 100%; height: 100%; object-fit: contain; }
#modified-image-container { cursor: crosshair; }

.info-bar { display: flex; justify-content: space-around; background-color: #0f3460; padding: clamp(10px, 1.5vh, 12px); border-radius: 10px; }
.info-box { text-align: center; }
.info-label { font-size: clamp(0.7em, 1.5vh, 0.9em); opacity: 0.7; }
.info-value { font-size: clamp(1em, 2.5vh, 1.5em); font-weight: 700; }

.controls { display: flex; justify-content: center; gap: clamp(5px, 1vw, 10px); flex-wrap: wrap; }
.controls button, .controls .back-button {
    padding: clamp(8px, 1.2vh, 10px) clamp(12px, 1.8vw, 18px);
    font-size: clamp(14px, 2vh, 16px);
    font-weight: 700; border: 2px solid var(--primary-color); background-color: transparent;
    border-radius: 10px; cursor: pointer; text-decoration: none;
    color: var(--primary-color); transition: all 0.2s ease;
}
.controls button:hover, .controls .back-button:hover { background-color: var(--primary-color); color: var(--text-color); }
.controls .back-button { background-color: #6c757d; border-color: #6c757d; color: white; }
.controls .back-button:hover { background-color: #5a6268; }

#ranking-panel {
    position: fixed; top: 20px; right: 20px; width: 300px;
    background-color: var(--surface-color); border: 1px solid var(--primary-color);
    border-radius: 12px; box-shadow: 0 5px 20px var(--shadow-color);
    z-index: 1001; overflow: hidden; transition: opacity 0.3s, transform 0.3s;
}
#ranking-panel.hidden { opacity: 0; transform: translateY(-20px); pointer-events: none; }
.ranking-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: #0f3460; font-weight: 700; }
#ranking-close-btn { background: none; border: none; color: var(--text-color); font-size: 20px; cursor: pointer; }
.ranking-list-container { padding: 15px; max-height: 300px; overflow-y: auto; }
#ranking-list { list-style: none; padding: 0; margin: 0; }
#ranking-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--slot-bg); }
#ranking-list li:last-child { border-bottom: none; }
#ranking-list .rank { font-weight: bold; color: var(--primary-color); flex-basis: 40px; text-align: left; }
#ranking-list .name { flex-grow: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 10px; }
#ranking-list .time { font-weight: bold; }

.ranking-footer { padding: 10px 15px; text-align: center; border-top: 1px solid var(--slot-bg); }
#ranking-reset-btn {
    padding: 8px 16px; font-size: 14px; font-weight: 600;
    border: 2px solid var(--primary-color); background-color: transparent;
    color: var(--primary-color); border-radius: 8px; cursor: pointer;
    transition: all 0.2s ease;
}
#ranking-reset-btn:hover { background-color: var(--primary-color); color: var(--text-color); }

#game-area:fullscreen { background-color: #000; padding: 0; gap: 5px; }
#game-area:fullscreen .image-container { border: none; border-radius: 0; }
#exitFullscreenBtn { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; background-color: rgba(0, 0, 0, 0.5); color: white; border: 2px solid white; border-radius: 50%; font-size: 24px; font-weight: bold; line-height: 36px; text-align: center; cursor: pointer; z-index: 2147473647; }
#exitFullscreenBtn:hover { background-color: rgba(255, 0, 0, 0.7); }
.hidden { display: none; }
.marker { position: absolute; width: 40px; height: 40px; border-radius: 50%; font-size: 30px; font-weight: bold; display: flex; justify-content: center; align-items: center; pointer-events: none; transform: translate(-50%, -50%); user-select: none; }
.marker.correct { color: #28a745; border: 3px solid #28a745; background-color: rgba(40, 167, 69, 0.2); }
.marker.incorrect { color: var(--primary-color); border: 3px solid var(--primary-color); background-color: rgba(233, 69, 96, 0.2); animation: fadeOut 1s forwards; }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
.modal.show { display: flex; }
.modal-content { background-color: var(--surface-color); padding: 30px 40px; border-radius: 20px; text-align: center; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 1px solid var(--primary-color); }
.modal-content h2 { margin-top: 0; font-size: 2em; color: var(--primary-color); }
.close-button { color: #aaa; position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: bold; cursor: pointer; }
.close-button:hover { color: white; }

.solution-image-container { margin-top: 20px; max-width: 500px; border: 2px solid var(--primary-color); border-radius: 10px; overflow: hidden; }
#solution-image { width: 100%; display: block; }
</style>
</head>
<body>

<div id="container">
  <div class="header"><h1>🔍 틀린 그림 찾기</h1></div>

  <div class="info-bar">
    <div class="info-box"><div class="info-label">문제</div><div class="info-value" id="problemName">-</div></div>
    <div class="info-box"><div class="info-label">시간</div><div class="info-value" id="timer">--:--</div></div>
    <div class="info-box"><div class="info-label">찾은 개수</div><div class="info-value" id="found-counter">0 / 0</div></div>
  </div>

  <div id="game-area">
    <div class="image-container" id="original-image-container"><img id="original-image" alt="원본 이미지"></div>
    <div class="image-container" id="modified-image-container"><img id="modified-image" alt="비교 이미지"></div>

    <div id="game-overlay">
      <button id="overlayStartBtn">시작하기</button>
      <div id="pauseText" class="hidden">⏸ 일시정지 중</div>
    </div>

    <div id="exitFullscreenBtn" class="hidden">✕</div>
  </div>

  <div class="controls">
    <button id="rankingButton">랭킹 보기</button>
    <button id="pauseButton">일시정지</button>
    <button id="restartButton">다시하기</button>
    <button id="fullscreenButton">전체화면</button>
    <a href="index.html" class="back-button">메인으로</a>
  </div>

  <div id="customPanel" style="flex-shrink:0; margin-top:6px; text-align:left; font-size:0.85rem;">
    <details>
      <summary style="cursor:pointer; opacity:0.8;">내 사진으로 문제 만들기 (여러 개 등록 가능, 관리자용)</summary>
      <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px; max-width:480px;">
        <input type="text" id="customName" placeholder="문제 이름 (예: 우리 회사 사무실)" style="padding:8px; border-radius:8px; border:1px solid var(--slot-bg); background:#0f3460; color:var(--text-color);">
        <label>원본 사진: <input type="file" id="origPhoto" accept="image/*"></label>
        <label>다른 점이 있는 사진: <input type="file" id="diffPhoto" accept="image/*"></label>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button id="addCustomBtn">추가하기</button>
          <span id="customStatus"></span>
        </div>
        <div>등록된 내 문제(임시, 이 브라우저에만) <b id="customCount" style="color:var(--primary-color);">0</b>개
          <button id="clearCustomBtn">전체 삭제</button>
        </div>
        <div style="margin-top:6px; padding-top:10px; border-top:1px solid var(--slot-bg);">
          <button id="exportBtn">📋 코드로 내보내기 (파일에 영구 반영하기)</button>
          <p style="opacity:0.75; margin:6px 0 0;">위 버튼을 누르면 아래에 코드가 생성돼요. 전체 복사해서 <code>race.html</code>이 아니라 <code>hiddencatch.html</code> 파일 안의 <code>EMBEDDED_CUSTOM_PROBLEMS</code> 배열 자리에 붙여넣고 저장하면, 어떤 기기에서 열어도 항상 그 문제가 나옵니다.</p>
          <textarea id="exportOutput" readonly style="width:100%; height:120px; margin-top:6px; background:#0f3460; color:var(--text-color); border:1px solid var(--slot-bg); border-radius:8px; padding:8px; font-family:monospace; font-size:0.75rem; display:none;"></textarea>
        </div>
      </div>
    </details>
  </div>
</div>

<div id="ranking-panel" class="hidden">
  <div class="ranking-header">
    <span>🏆 랭킹</span>
    <button id="ranking-close-btn">×</button>
  </div>
  <div class="ranking-list-container"><ul id="ranking-list"></ul></div>
  <div class="ranking-footer"><button id="ranking-reset-btn">랭킹 초기화</button></div>
</div>

<div id="gameOverModal" class="modal">
  <div class="modal-content">
    <span class="close-button" id="closeGameOverModal">&times;</span>
    <h2>🎉 모두 찾았습니다! 🎉</h2>
    <p id="finalTime"></p>
    <div class="solution-image-container"><img id="solution-image" alt="정답 이미지"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const gameArea = document.getElementById('game-area');
    const restartButton = document.getElementById('restartButton');
    const pauseButton = document.getElementById('pauseButton');
    const fullscreenButton = document.getElementById('fullscreenButton');
    const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
    const timerEl = document.getElementById('timer');
    const foundCounterEl = document.getElementById('found-counter');
    const problemNameEl = document.getElementById('problemName');
    const originalImage = document.getElementById('original-image');
    const modifiedImage = document.getElementById('modified-image');
    const modifiedImageContainer = document.getElementById('modified-image-container');
    const gameOverlay = document.getElementById('game-overlay');
    const overlayStartBtn = document.getElementById('overlayStartBtn');
    const pauseText = document.getElementById('pauseText');
    const gameOverModal = document.getElementById('gameOverModal');
    const closeGameOverModal = document.getElementById('closeGameOverModal');
    const finalTimeEl = document.getElementById('finalTime');
    const solutionImage = document.getElementById('solution-image');
    const rankingButton = document.getElementById('rankingButton');
    const rankingPanel = document.getElementById('ranking-panel');
    const rankingCloseBtn = document.getElementById('ranking-close-btn');
    const rankingList = document.getElementById('ranking-list');
    const resetRankingButton = document.getElementById('ranking-reset-btn');

    let timerInterval, seconds = 0, differences = [], foundCount = 0, totalDifferences = 0;
    let isGameActive = false, isPaused = false;
    let currentProblem;

    // ▼ 원본 이미지 파일 대신, 매번 코드로 새 장면을 그려서 사용합니다.
    const SCENE_NAMES = ['바닷속 풍경', '선물보따리', '사무실 책상', '정글 탐험', '해적선', '디저트 파티'];
    const PALETTES = ['#57E0D8', '#FFB648', '#FF6B5B', '#8E7CF0', '#F3F1EC', '#4CD68A'];
    const CANVAS_W = 700, CANVAS_H = 520;

    function drawStar(ctx, cx, cy, outerR, innerR) {
        let rot = Math.PI / 2 * 3;
        const spikes = 5, step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerR);
        for (let i = 0; i < spikes; i++) {
            let x = cx + Math.cos(rot) * outerR, y = cy + Math.sin(rot) * outerR;
            ctx.lineTo(x, y); rot += step;
            x = cx + Math.cos(rot) * innerR; y = cy + Math.sin(rot) * innerR;
            ctx.lineTo(x, y); rot += step;
        }
        ctx.lineTo(cx, cy - outerR);
        ctx.closePath();
        ctx.fill();
    }

    function drawShape(ctx, s) {
        ctx.fillStyle = s.color;
        ctx.save();
        if (s.type === 'circle') { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
        else if (s.type === 'rect') {
            ctx.translate(s.x + s.w / 2, s.y + s.h / 2);
            ctx.rotate(((s.rot || 0) * Math.PI) / 180);
            ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
        } else if (s.type === 'star') { drawStar(ctx, s.x, s.y, s.r, s.r / 2); }
        ctx.restore();
    }

    function makeShapes() {
        const shapes = [];
        for (let i = 0; i < 9; i++) {
            const type = ['circle', 'rect', 'star'][Math.floor(Math.random() * 3)];
            const x = 50 + Math.random() * (CANVAS_W - 100);
            const y = 50 + Math.random() * (CANVAS_H - 100);
            const color = PALETTES[Math.floor(Math.random() * PALETTES.length)];
            if (type === 'circle') shapes.push({ type, x, y, r: 20 + Math.random() * 20, color });
            else if (type === 'rect') shapes.push({ type, x, y, w: 40 + Math.random() * 30, h: 40 + Math.random() * 30, rot: Math.random() * 30 - 15, color });
            else shapes.push({ type, x, y, r: 24 + Math.random() * 14, color });
        }
        return shapes;
    }

    function makeDiffVersion(base) {
        const clone = base.map(s => ({ ...s }));
        const indices = [...Array(clone.length).keys()];
        for (let i = indices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        const count = 6;
        const chosen = indices.slice(0, count);
        const spots = [];
        chosen.forEach(i => {
            const s = clone[i];
            const mode = Math.floor(Math.random() * 3);
            if (mode === 0) {
                s.x = Math.min(CANVAS_W - 30, Math.max(30, s.x + (Math.random() > 0.5 ? 50 : -50)));
                s.y = Math.min(CANVAS_H - 30, Math.max(30, s.y + (Math.random() > 0.5 ? 40 : -40)));
            } else if (mode === 1) {
                let c = s.color;
                while (c === s.color) c = PALETTES[Math.floor(Math.random() * PALETTES.length)];
                s.color = c;
            } else {
                if (s.r) s.r *= 1.5;
                if (s.w) { s.w *= 1.4; s.h *= 1.4; }
            }
            spots.push({ x: s.x, y: s.y, r: 30 });
        });
        return { version: clone, spots };
    }

    function renderScene(shapes, bgColor) {
        const c = document.createElement('canvas');
        c.width = CANVAS_W; c.height = CANVAS_H;
        const ctx = c.getContext('2d');
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        shapes.forEach(s => drawShape(ctx, s));
        return c;
    }

    function buildProblem(name) {
        const base = makeShapes();
        const { version, spots } = makeDiffVersion(base);
        const bg = '#12162B';

        const qCanvas = renderScene(base, bg);
        const aCanvas = renderScene(version, bg);

        // 정답(solution) 이미지: 답 장면 위에 다른 부분을 초록 원으로 표시
        const sCanvas = document.createElement('canvas');
        sCanvas.width = CANVAS_W; sCanvas.height = CANVAS_H;
        const sCtx = sCanvas.getContext('2d');
        sCtx.drawImage(aCanvas, 0, 0);
        sCtx.strokeStyle = '#28a745';
        sCtx.lineWidth = 4;
        spots.forEach(sp => { sCtx.beginPath(); sCtx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); sCtx.stroke(); });

        return {
            name,
            images: { question: qCanvas.toDataURL(), answer: aCanvas.toDataURL(), solution: sCanvas.toDataURL() },
            spots
        };
    }

    function openFullscreen(element) {
        if (element.requestFullscreen) element.requestFullscreen();
        else if (element.mozRequestFullScreen) element.mozRequestFullScreen();
        else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
        else if (element.msRequestFullscreen) element.msRequestFullscreen();
    }
    function closeFullscreen() {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
    }

    overlayStartBtn.addEventListener('click', startGame);
    restartButton.addEventListener('click', initGame);
    pauseButton.addEventListener('click', togglePause);
    fullscreenButton.addEventListener('click', () => openFullscreen(gameArea));
    exitFullscreenBtn.addEventListener('click', () => closeFullscreen());
    modifiedImageContainer.addEventListener('click', handleImageClick);
    closeGameOverModal.addEventListener('click', () => gameOverModal.classList.remove('show'));
    document.addEventListener('fullscreenchange', () => {
        exitFullscreenBtn.classList.toggle('hidden', !document.fullscreenElement);
        setTimeout(redrawMarkers, 50);
    });
    document.addEventListener('webkitfullscreenchange', () => {
        exitFullscreenBtn.classList.toggle('hidden', !document.webkitIsFullScreen);
        setTimeout(redrawMarkers, 50);
    });
    rankingButton.addEventListener('click', showRanking);
    rankingCloseBtn.addEventListener('click', () => rankingPanel.classList.add('hidden'));
    resetRankingButton.addEventListener('click', resetRanking);
    window.addEventListener('resize', redrawMarkers);

    // ▼▼▼ 사전 등록한 문제를 여기에 붙여넣으세요 ▼▼▼
    // 아래 "내 사진으로 문제 만들기" 패널에서 사진을 등록하고 "코드로 내보내기"를 누르면
    // 이 배열에 붙여넣을 수 있는 코드가 만들어집니다. 그렇게 하면 이 파일을 여는 어떤 기기에서든
    // (localStorage 없이도) 항상 같은 문제가 나타납니다.
    const EMBEDDED_CUSTOM_PROBLEMS = [
        // { name: '우리 회사 사무실', images: { question: 'data:image/jpeg;base64,...', answer: '...', solution: '...' }, spots: [{x:120,y:80,r:30}, ...] },
    ];
    // ▲▲▲ 여기까지 ▲▲▲

    const CUSTOM_KEY = 'tc_hiddencatch_custom_problems';

    function loadCustomProblems(){
        try{ return JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; }
        catch(e){ return []; }
    }
    function saveCustomProblems(list){ localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); }

    function drawCoverFitTo(ctx, img, w, h){
        ctx.clearRect(0,0,w,h);
        const scale = Math.max(w/img.width, h/img.height);
        const dw = img.width*scale, dh = img.height*scale;
        ctx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
    }

    function loadImageFile(file){
        return new Promise((resolve, reject)=>{
            const reader = new FileReader();
            reader.onload = (ev)=>{
                const img = new Image();
                img.onload = ()=>resolve(img);
                img.onerror = reject;
                img.src = ev.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function computeDiffSpots(imgA, imgB, W, H){
        const cA = document.createElement('canvas'); cA.width = W; cA.height = H;
        const ctxA = cA.getContext('2d'); drawCoverFitTo(ctxA, imgA, W, H);
        const cB = document.createElement('canvas'); cB.width = W; cB.height = H;
        const ctxB = cB.getContext('2d'); drawCoverFitTo(ctxB, imgB, W, H);

        const dataA = ctxA.getImageData(0,0,W,H).data;
        const dataB = ctxB.getImageData(0,0,W,H).data;

        const grid = 10;
        const cols = Math.floor(W/grid), rows = Math.floor(H/grid);
        const changed = new Array(cols*rows).fill(false);

        for(let gy=0; gy<rows; gy++){
            for(let gx=0; gx<cols; gx++){
                const px = Math.min(W-1, gx*grid + Math.floor(grid/2));
                const py = Math.min(H-1, gy*grid + Math.floor(grid/2));
                const idx = (py*W + px) * 4;
                const diff = Math.abs(dataA[idx]-dataB[idx]) + Math.abs(dataA[idx+1]-dataB[idx+1]) + Math.abs(dataA[idx+2]-dataB[idx+2]);
                if(diff > 60) changed[gy*cols+gx] = true;
            }
        }

        const visited = new Array(cols*rows).fill(false);
        const clusters = [];
        for(let i=0;i<cols*rows;i++){
            if(changed[i] && !visited[i]){
                const stack = [i]; visited[i] = true;
                const cells = [];
                while(stack.length){
                    const c = stack.pop();
                    cells.push(c);
                    const cx = c % cols, cy = Math.floor(c/cols);
                    [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]].forEach(([nx,ny])=>{
                        if(nx>=0 && nx<cols && ny>=0 && ny<rows){
                            const ni = ny*cols+nx;
                            if(changed[ni] && !visited[ni]){ visited[ni] = true; stack.push(ni); }
                        }
                    });
                }
                if(cells.length >= 2){
                    let sx=0, sy=0, minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
                    cells.forEach(c=>{
                        const cx = (c%cols)*grid + grid/2, cy = Math.floor(c/cols)*grid + grid/2;
                        sx += cx; sy += cy;
                        minX = Math.min(minX,cx); maxX = Math.max(maxX,cx);
                        minY = Math.min(minY,cy); maxY = Math.max(maxY,cy);
                    });
                    const r = Math.min(50, Math.max(26, Math.max(maxX-minX, maxY-minY)/2 + 12));
                    clusters.push({ x: sx/cells.length, y: sy/cells.length, r, size: cells.length });
                }
            }
        }
        clusters.sort((a,b)=>b.size-a.size);
        const spots = clusters.slice(0, 8).map(c=>({ x:c.x, y:c.y, r:c.r }));
        return { spots, qCanvas: cA, aCanvas: cB };
    }

    async function addCustomProblem(){
        const nameInput = document.getElementById('customName');
        const origInput = document.getElementById('origPhoto');
        const diffInput = document.getElementById('diffPhoto');
        const statusEl = document.getElementById('customStatus');

        if(!origInput.files[0] || !diffInput.files[0]){
            statusEl.textContent = '두 사진을 모두 선택해주세요.';
            return;
        }
        statusEl.textContent = '분석 중...';
        try{
            const [imgA, imgB] = await Promise.all([loadImageFile(origInput.files[0]), loadImageFile(diffInput.files[0])]);
            const { spots, qCanvas, aCanvas } = computeDiffSpots(imgA, imgB, CANVAS_W, CANVAS_H);

            if(spots.length < 2){
                statusEl.textContent = '차이를 충분히 찾지 못했어요. 더 뚜렷하게 차이 나는 사진으로 시도해주세요.';
                return;
            }

            const sCanvas = document.createElement('canvas');
            sCanvas.width = CANVAS_W; sCanvas.height = CANVAS_H;
            const sCtx = sCanvas.getContext('2d');
            sCtx.drawImage(aCanvas, 0, 0);
            sCtx.strokeStyle = '#28a745';
            sCtx.lineWidth = 4;
            spots.forEach(sp => { sCtx.beginPath(); sCtx.arc(sp.x, sp.y, sp.r, 0, Math.PI*2); sCtx.stroke(); });

            const list = loadCustomProblems();
            list.push({
                name: (nameInput.value || '내 사진 문제').trim(),
                images: { question: qCanvas.toDataURL('image/jpeg', 0.85), answer: aCanvas.toDataURL('image/jpeg', 0.85), solution: sCanvas.toDataURL('image/jpeg', 0.85) },
                spots
            });
            saveCustomProblems(list);
            statusEl.textContent = `✓ 등록 완료! (다른 점 ${spots.length}곳 감지됨)`;
            nameInput.value = ''; origInput.value = ''; diffInput.value = '';
            updateCustomCount();
        } catch(e){
            statusEl.textContent = '사진을 읽는 중 오류가 발생했습니다.';
        }
    }

    function updateCustomCount(){
        document.getElementById('customCount').textContent = loadCustomProblems().length;
    }
    function clearCustomProblems(){
        if(!confirm('등록된 내 문제를 전부 삭제할까요?')) return;
        saveCustomProblems([]);
        updateCustomCount();
        document.getElementById('customStatus').textContent = '';
    }

    function exportCustomProblems(){
        const list = loadCustomProblems();
        const output = document.getElementById('exportOutput');
        if(list.length === 0){
            output.style.display = 'block';
            output.value = '등록된 문제가 없습니다. 먼저 사진을 등록해주세요.';
            return;
        }
        const code = 'const EMBEDDED_CUSTOM_PROBLEMS = ' + JSON.stringify(list, null, 2) + ';';
        output.style.display = 'block';
        output.value = code;
        output.focus();
        output.select();
    }

    document.getElementById('addCustomBtn').addEventListener('click', addCustomProblem);
    document.getElementById('clearCustomBtn').addEventListener('click', clearCustomProblems);
    document.getElementById('exportBtn').addEventListener('click', exportCustomProblems);
    updateCustomCount();

    function pickProblem(){
        const customList = loadCustomProblems();
        const pool = [
            ...SCENE_NAMES.map(name => ({ kind: 'scene', name })),
            ...EMBEDDED_CUSTOM_PROBLEMS.map(p => ({ kind: 'data', data: p })),
            ...customList.map(p => ({ kind: 'data', data: p })),
        ];
        const pick = pool[Math.floor(Math.random() * pool.length)];
        return pick.kind === 'scene' ? buildProblem(pick.name) : pick.data;
    }

    function initGame() {
        isGameActive = false; isPaused = false;
        clearInterval(timerInterval);
        seconds = 0; foundCount = 0;
        currentProblem = pickProblem();
        problemNameEl.textContent = currentProblem.name;
        originalImage.src = currentProblem.images.question;
        modifiedImage.src = currentProblem.images.answer;
        differences = currentProblem.spots.map(spot => ({ ...spot, found: false }));
        totalDifferences = differences.length;
        clearMarkers();
        gameOverModal.classList.remove('show');
        updateUI();
        timerEl.textContent = '--:--';
        gameOverlay.classList.remove('hidden');
        overlayStartBtn.classList.remove('hidden');
        pauseText.classList.add('hidden');
        pauseButton.textContent = '일시정지';
    }

    function startGame() { if (isGameActive) return; isGameActive = true; gameOverlay.classList.add('hidden'); timerInterval = setInterval(updateTimer, 1000); }
    function togglePause() { if (!isGameActive) return; isPaused = !isPaused; gameOverlay.classList.toggle('hidden', !isPaused); overlayStartBtn.classList.add('hidden'); pauseText.classList.toggle('hidden', !isPaused); pauseButton.textContent = isPaused ? '계속하기' : '일시정지'; }
    function updateTimer() { if (isPaused || !isGameActive) return; seconds++; updateUI(); }

    function getRenderedImageInfo(imgElement) {
        const { naturalWidth, naturalHeight, clientWidth, clientHeight } = imgElement;
        if (!naturalWidth || !naturalHeight) return null;
        const naturalAspectRatio = naturalWidth / naturalHeight;
        const clientAspectRatio = clientWidth / clientHeight;
        let renderedWidth, renderedHeight, xOffset, yOffset;
        if (naturalAspectRatio > clientAspectRatio) {
            renderedWidth = clientWidth; renderedHeight = clientWidth / naturalAspectRatio;
            xOffset = 0; yOffset = (clientHeight - renderedHeight) / 2;
        } else {
            renderedHeight = clientHeight; renderedWidth = clientHeight * naturalAspectRatio;
            yOffset = 0; xOffset = (clientWidth - renderedWidth) / 2;
        }
        return { renderedWidth, renderedHeight, xOffset, yOffset };
    }

    function handleImageClick(event) {
        if (!isGameActive || isPaused) return;
        const img = modifiedImage;
        const info = getRenderedImageInfo(img);
        if (!info) return;
        const { renderedWidth, renderedHeight, xOffset, yOffset } = info;

        const clickX_in_box = event.offsetX;
        const clickY_in_box = event.offsetY;

        if (clickX_in_box < xOffset || clickX_in_box > xOffset + renderedWidth ||
            clickY_in_box < yOffset || clickY_in_box > yOffset + renderedHeight) return;

        const clickX_on_image = clickX_in_box - xOffset;
        const clickY_on_image = clickY_in_box - yOffset;
        const scale = img.naturalWidth / renderedWidth;
        const finalX = clickX_on_image * scale;
        const finalY = clickY_on_image * scale;

        let foundDifference = false;
        for (const diff of differences) {
            if (diff.found) continue;
            const distance = Math.sqrt(Math.pow(finalX - diff.x, 2) + Math.pow(finalY - diff.y, 2));
            if (distance < diff.r) {
                diff.found = true; foundCount++; foundDifference = true;
                createMarker(diff, 'correct');
                updateUI();
                break;
            }
        }
        if (!foundDifference) createMarker(event, 'incorrect');
        if (foundCount === totalDifferences) endGame();
    }

    function createMarker(data, type) {
        const marker = document.createElement('div');
        marker.className = `marker ${type}`;
        if (type === 'correct') {
            marker.textContent = 'O';
            const img = modifiedImage;
            const info = getRenderedImageInfo(img);
            if (!info) return;
            const { renderedWidth, xOffset, yOffset } = info;
            const scale = renderedWidth / img.naturalWidth;
            marker.style.left = `${data.x * scale + xOffset}px`;
            marker.style.top = `${data.y * scale + yOffset}px`;
        } else {
            marker.textContent = 'X';
            marker.style.left = `${data.offsetX}px`;
            marker.style.top = `${data.offsetY}px`;
            setTimeout(() => marker.remove(), 1000);
        }
        modifiedImageContainer.appendChild(marker);
    }

    function redrawMarkers() {
        if (!isGameActive) return;
        clearMarkers();
        differences.forEach(diff => { if (diff.found) createMarker(diff, 'correct'); });
    }
    function clearMarkers() { modifiedImageContainer.querySelectorAll('.marker').forEach(m => m.remove()); }

    function endGame() {
        isGameActive = false;
        clearInterval(timerInterval);
        addScoreToRanking(seconds);
        finalTimeEl.textContent = `걸린 시간: ${formatTime(seconds)}`;
        solutionImage.src = currentProblem.images.solution;
        gameOverModal.classList.add('show');
    }
    function updateUI() { if (isGameActive) timerEl.textContent = formatTime(seconds); foundCounterEl.textContent = `${foundCount} / ${totalDifferences}`; }
    function formatTime(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
    function escapeHtml(unsafe) {
        if (typeof unsafe !== 'string') return '';
        return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    function addScoreToRanking(time) {
        const playerName = prompt('🎉 성공! 랭킹에 등록할 이름을 입력하세요:', 'Player1');
        if (!playerName || playerName.trim() === '') { alert('이름이 입력되지 않아 랭킹에 등록되지 않았습니다.'); return; }
        const key = 'hiddencatchRanking_unified';
        const ranking = JSON.parse(localStorage.getItem(key)) || [];
        ranking.push({ name: playerName.trim(), time, date: new Date().toLocaleDateString() });
        ranking.sort((a, b) => a.time - b.time);
        localStorage.setItem(key, JSON.stringify(ranking.slice(0, 10)));
    }
    function showRanking() {
        const key = 'hiddencatchRanking_unified';
        const rankings = JSON.parse(localStorage.getItem(key)) || [];
        rankingList.innerHTML = rankings.length === 0 ? '<li>기록이 없습니다.</li>' : rankings.map((r, i) => `<li><span class="rank">${i + 1}등</span><span class="name">${escapeHtml(r.name)}</span><span class="time">${formatTime(r.time)}</span></li>`).join('');
        rankingPanel.classList.remove('hidden');
    }
    function resetRanking() {
        if (confirm('정말로 랭킹을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
            localStorage.removeItem('hiddencatchRanking_unified');
            alert('랭킹이 초기화되었습니다.');
            showRanking();
        }
    }

    initGame();
});
</script>
