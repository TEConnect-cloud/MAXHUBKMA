<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스피드 넌센스 퀴즈 · 테크커넥트 게임 이벤트</title>
<link rel="stylesheet" href="style.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');

* { padding: 0; margin: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; }

body {
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f0f4f8;
    color: #333;
    padding: 10px;
    min-height: 100vh;
}

.game-container {
    width: 100%;
    max-width: 800px;
    min-height: 640px;
    max-height: 95vh;
    padding: clamp(15px, 3vw, 25px);
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

h1 { color: #2c3e50; flex-shrink: 0; font-size: clamp(1.5rem, 5vw, 2.2rem); }
.game-info-panel { flex-shrink: 0; }
.timer-bar { width: 100%; height: 15px; background-color: #e0e0e0; border-radius: 10px; overflow: hidden; }
.timer-progress { width: 100%; height: 100%; background: linear-gradient(90deg, #43e97b, #ffdd57, #ff5151); border-radius: 8px; transition: width 0.1s linear; }
.status-bar { display: flex; justify-content: space-between; margin-top: 8px; font-size: 1.1rem; font-weight: bold; color: #555; }

.game-area {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    min-height: 320px;
    position: relative;
    gap: 10px;
}

.quiz-area { background: #e3f2fd; padding: 15px; border-radius: 12px; flex-shrink: 0; }
#quiz-question { font-size: clamp(1.1rem, 4vw, 1.6rem); font-weight: 700; color: #1e88e5; word-break: keep-all; }
.hint-area { height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#hint-text { font-size: 1.2rem; font-weight: bold; color: #ff6f00; background-color: #fffbe2; padding: 5px 15px; border-radius: 20px; }
.drawing-area-wrapper { flex-grow: 1; min-height: 0; }
#drawing-canvas { width: 100%; height: 100%; border: 2px solid #ddd; border-radius: 10px; cursor: crosshair; touch-action: none; }

.game-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
.game-controls button, .home-btn { padding: 10px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; text-decoration: none; color: white; }
.game-controls button:disabled { background-color: #ccc; cursor: not-allowed; }

.tool-btn { padding: 8px; font-size: 1.2rem; min-width: 45px; line-height: 1; background-color: #f0f0f0; color: #333; border: 2px solid #ccc; }
.tool-btn.active { background-color: #007bff; color: white; border-color: #0056b3; }

#hint-btn { background-color: #ffc107; }
#clear-btn { background-color: #6c757d; }
#answer-btn { background-color: #28a745; }
#pause-btn { background-color: #17a2b8; }
#restart-btn-main { background-color: #dc3545; }
.home-btn { background-color: #6c757d; }
#ranking-btn { background-color: #8e44ad; }

.overlay, .modal-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
}
.overlay.visible, .modal-overlay.visible { opacity: 1; pointer-events: all; }
.modal-overlay { position: fixed; border-radius: 0; }

#start-btn { padding: 20px 40px; font-size: 2rem; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; color: white; background-color: #007bff; }

.modal-content { background: white; padding: 30px 40px; border-radius: 20px; text-align: center; max-width: 90%; }
.modal-content h2 { margin-bottom: 15px; color: #1e88e5; }
#modal-answer-text { font-size: 2.5rem; font-weight: bold; color: #d32f2f; margin-bottom: 20px; }

.ox-buttons { display: flex; gap: 20px; justify-content: center; }
.ox-btn { padding: 15px 30px; font-size: 1.5rem; border-radius: 10px; border: 2px solid; background: white; cursor: pointer; font-weight: bold; }
#correct-btn { border-color: #28a745; color: #28a745; }
#incorrect-btn { border-color: #dc3545; color: #dc3545; }

#result-title { font-size: 2rem; }
#final-score-text { font-size: 3rem; font-weight: bold; color: #d32f2f; margin: 20px 0; }
.result-buttons { display: flex; gap: 15px; justify-content: center; }
.result-buttons button { padding: 12px 25px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
#show-ranking-btn { background-color: #ffc107; }
#restart-btn-modal { background-color: #007bff; }

/* ranking.js가 생성하는 팝업(#rankingModal, #nameModal)은 이 페이지의
   .modal-overlay 기본값(opacity:0)에 가려지지 않도록 별도 우선 규칙을 둡니다. */
#rankingModal, #nameModal { opacity: 1; pointer-events: auto; }
#rankingModal.hidden, #nameModal.hidden { display: none; }
</style>
</head>
<body>

<div class="game-container">

    <div class="hint-area"><div id="hint-text"></div></div>
    <div class="drawing-area-wrapper"><canvas id="drawing-canvas"></canvas></div>

    <div class="overlay" id="overlay"></div>

    <div class="modal-overlay" id="answer-modal">
      <div class="modal-content">
        <h2>정답은?</h2>
        <div id="modal-answer-text"></div>
        <div class="ox-buttons">

        </div>
      </div>
    </div>

    <div class="modal-overlay" id="result-modal">
      <div class="modal-content">
        <h2 id="result-title"></h2>
        <div id="final-score-text"></div>
        <div class="result-buttons">
          <button id="show-ranking-btn">랭킹 등록하기</button>
          <button id="restart-btn-modal">다시하기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="game-controls">
    <button id="ranking-btn">랭킹 보기</button>
    <button id="clear-btn">🧹 지우기</button>
    <button id="hint-btn">힌트</button>

    <button id="pause-btn">일시정지</button>
    <button id="restart-btn-main">다시하기</button>
    <a href="index.html" class="home-btn">메인으로</a>
  </div>
</div>

        { question: "할아버지가 가장 좋아하는 돈은?", answer: "할머니" },
        { question: "한의사가 가장 싫어하는 말은?", answer: "밥이 보약이다" },
        { question: "털이 길게 자란 남자를 다른 말로?", answer: "모자란놈" },
        { question: "개리가 온천에 갔다를 네 글자로 표현하면?", answer: "스파게리" },
        { question: "절대로 놀라지 않는 연예인은?", answer: "태연" },
        { question: "바람이 귀엽게 부는 동네는?", answer: "분당" },
        { question: "소변과 대변중 먼저 나오는 것은?", answer: "급한 것" }
    ];

    const GAME_ID = 'nonsense_quiz';
    const TOTAL_ROUNDS = 5;
    const TIME_LIMIT = 30 * 1000;
    let quizSet = [], currentRound = 0, score = 0, currentQuiz = {};
    let timerId, isPaused = false, isGameActive = false, isDrawing = false;
    let timerStartTime, timeRemainingOnPause;


    function initGame() {
        isGameActive = false;
        isPaused = false;
        cancelAnimationFrame(timerId);

        overlay.classList.add('visible');
        overlay.innerHTML = '<div class="overlay-content"><button id="start-btn">시작하기</button></div>';
        document.getElementById('start-btn').addEventListener('click', startGame);

        questionEl.textContent = "아래 '시작하기' 버튼을 눌러주세요!";
        progressDisplay.textContent = `문제: 0/${TOTAL_ROUNDS}`;
        scoreDisplay.textContent = `점수: 0점`;
        timerProgress.style.transition = 'none';
        timerProgress.style.width = '100%';
        hintTextEl.textContent = '';
        clearCanvas();

        hintBtn.disabled = true;
        answerBtn.disabled = true;
        pauseBtn.disabled = true;
        rankingBtn.disabled = true;
        pauseBtn.textContent = '일시정지';
    }

    function startGame() {
        isGameActive = true;
        overlay.classList.remove('visible');

        const shuffled = [...fullQuizData].sort(() => 0.5 - Math.random());
        quizSet = shuffled.slice(0, TOTAL_ROUNDS);

        currentRound = 0;
        score = 0;
        resultModal.classList.remove('visible');
        answerModal.classList.remove('visible');
        updateScore();

        pauseBtn.disabled = false;
        rankingBtn.disabled = false;
        loadNextQuiz();
    }

    function loadNextQuiz() {
        if (currentRound >= TOTAL_ROUNDS) {
            endGame();
            return;
        }

        currentQuiz = quizSet[currentRound];
        currentRound++;

        questionEl.textContent = currentQuiz.question;
        progressDisplay.textContent = `문제: ${currentRound}/${TOTAL_ROUNDS}`;
        hintTextEl.textContent = '';
        hintBtn.disabled = false;
        answerBtn.disabled = false;
        clearCanvas();
        startTimer(TIME_LIMIT);
    }

    function startTimer(duration) {
        cancelAnimationFrame(timerId);
        timerStartTime = Date.now();

        function timerLoop() {
            if (isPaused) return;

            const elapsedTime = Date.now() - timerStartTime;
            const remainingTime = duration - elapsedTime;

            if (remainingTime <= 0) {
                timerProgress.style.width = '0%';
                showAnswer();
                return;
            }

            const widthPercent = (remainingTime / TIME_LIMIT) * 100;
            timerProgress.style.width = `${widthPercent}%`;

            timerId = requestAnimationFrame(timerLoop);
        }
        timerId = requestAnimationFrame(timerLoop);
    }

    function togglePause() {
        if (!isGameActive) return;
        isPaused = !isPaused;

        if (isPaused) {
            cancelAnimationFrame(timerId);
            const elapsedTime = Date.now() - timerStartTime;
            timeRemainingOnPause = (timeRemainingOnPause || TIME_LIMIT) - elapsedTime;
            pauseBtn.textContent = '계속하기';
        } else {
            startTimer(timeRemainingOnPause);
            pauseBtn.textContent = '일시정지';
        }
    }

    function showHint() {
        const answer = currentQuiz.answer;
        let hint = '힌트: ';
        for (let i = 0; i < answer.length; i++) {
            if (i === 0) hint += answer[i];
            else if (answer[i] === ' ') hint += ' ';
            else hint += 'O';
        }
        hintTextEl.textContent = hint;
        hintBtn.disabled = true;
    }

    function showAnswer() {
        cancelAnimationFrame(timerId);
        modalAnswerText.textContent = currentQuiz.answer;
        answerModal.classList.add('visible');
    }

    function handleAnswer(isCorrect) {
        if (isCorrect) { score += 20; updateScore(); }
        answerModal.classList.remove('visible');
        loadNextQuiz();
    }

    function updateScore() { scoreDisplay.textContent = `점수: ${score}점`; }

    function endGame() {
        isGameActive = false;
        pauseBtn.disabled = true;
        cancelAnimationFrame(timerId);
        resultTitle.textContent = score === 100 ? '🎉 완벽해요! 🎉' : '게임 종료!';
        finalScoreText.textContent = `${score}점`;
        resultModal.classList.add('visible');
    }

    function showAndRegisterRanking() {
        Ranking.promptNameAndSave(GAME_ID, "넌센스 퀴즈", score, `${score}점`, 'desc');
    }

    function setupPen() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 5;
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#000';
        setupPen();
    }
    function startDrawing(e) { if (isGameActive && !isPaused) { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); } }
    function draw(e) { if (isDrawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); } }
    function stopDrawing() { isDrawing = false; }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    rankingBtn.addEventListener('click', () => { Ranking.showModal(GAME_ID, "넌센스 퀴즈"); });

    clearBtn.addEventListener('click', clearCanvas);
    hintBtn.addEventListener('click', showHint);
    answerBtn.addEventListener('click', showAnswer);
    pauseBtn.addEventListener('click', togglePause);
    restartBtnMain.addEventListener('click', initGame);
    restartBtnModal.addEventListener('click', () => { resultModal.classList.remove('visible'); initGame(); });
    correctBtn.addEventListener('click', () => handleAnswer(true));
    incorrectBtn.addEventListener('click', () => handleAnswer(false));
    showRankingBtn.addEventListener('click', showAndRegisterRanking);

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing({ offsetX: e.touches[0].clientX - canvas.getBoundingClientRect().left, offsetY: e.touches[0].clientY - canvas.getBoundingClientRect().top }); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw({ offsetX: e.touches[0].clientX - canvas.getBoundingClientRect().left, offsetY: e.touches[0].clientY - canvas.getBoundingClientRect().top }); });
    canvas.addEventListener('touchend', stopDrawing);

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initGame();
});
</script>

</body>
</html>
